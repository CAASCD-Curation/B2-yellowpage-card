<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄页经典艺术档案 · 内容交互卡片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf7ea;
  --paper-2:#f3efdc;
  --yp:#f6d911;
  --yp-deep:#e8c800;
  --ink:#171510;
  --ink-3:#6f6a58;
  --line:#e3dec9;
  --line-strong:#171510;
  --ease:cubic-bezier(.22,1,.36,1);
  --fs-h6:12px;
  --mono:'Space Mono',ui-monospace,monospace;
  --disp:'Bebas Neue','PingFang SC','Microsoft YaHei',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--ink);color:var(--yp)}

/* ---------- header ---------- */
header{
  position:relative;
  background:var(--yp);
  border-bottom:1px solid var(--line-strong);
  overflow:hidden;
}
.header-inner{
  max-width:1440px;margin:0 auto;
  padding:34px 32px 26px;
  position:relative;z-index:2;
}
.logotype{
  display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
}
.logotype h1{
  font-family:var(--body);
  font-weight:900;
  font-size:clamp(30px,4.6vw,52px);
  letter-spacing:.02em;
  line-height:1.05;
}
.logotype .en{
  font-family:var(--disp);
  font-size:clamp(20px,2.6vw,32px);
  letter-spacing:.14em;
  opacity:.62;
}
.header-sub{
  margin-top:12px;
  max-width:760px;
  font-size:13.5px;
  color:rgba(23,21,16,.78);
}
.header-sub b{font-weight:700}
/* thumb-index edge, like a real directory */
.thumb-index{
  position:absolute;top:0;right:0;bottom:0;width:118px;
  display:flex;flex-direction:column;z-index:1;
}
.thumb-index span{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-size:20px;letter-spacing:.1em;
  border-left:1px solid rgba(23,21,16,.28);
  border-bottom:1px solid rgba(23,21,16,.28);
  color:rgba(23,21,16,.55);
  cursor:pointer;
  transition:background .18s var(--ease),color .18s var(--ease);
  user-select:none;
}
.thumb-index span:last-child{border-bottom:none}
.thumb-index span:hover,.thumb-index span.on{background:var(--ink);color:var(--yp)}

/* ---------- stat ticker ---------- */
.stats{
  border-bottom:1px solid var(--line-strong);
  background:var(--ink);
  color:var(--paper);
  overflow:hidden;white-space:nowrap;
}
.stats-track{
  display:inline-flex;gap:0;
  animation:tick 30s linear infinite;
  padding:9px 0;
}
.stats:hover .stats-track{animation-play-state:paused}
.stat-item{
  display:inline-flex;align-items:baseline;gap:10px;
  padding:0 34px;
  border-right:1px solid rgba(250,247,234,.22);
}
.stat-item .n{font-family:var(--disp);font-size:22px;letter-spacing:.06em;color:var(--yp)}
.stat-item .l{font-size:11px;letter-spacing:.22em;color:rgba(250,247,234,.66)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- filter bar ---------- */
.filterbar{
  position:sticky;top:0;z-index:50;
  background:var(--paper);
  border-bottom:1px solid var(--line-strong);
  transition:transform .15s cubic-bezier(.7,0,.3,1);
}
.filter-inner{max-width:1440px;margin:0 auto;padding:14px 32px 12px}
.collections{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line-strong);width:fit-content;max-width:100%}
.collections button{
  appearance:none;border:none;background:transparent;cursor:pointer;
  font-family:var(--body);font-size:13px;font-weight:600;
  padding:8px 18px;color:var(--ink);
  border-right:1px solid var(--line-strong);
  transition:background .15s var(--ease),color .15s var(--ease);
  white-space:nowrap;
}
.collections button:last-child{border-right:none}
.collections button small{font-family:var(--mono);font-size:10px;opacity:.55;margin-left:6px}
.collections button.on{background:var(--ink);color:var(--yp)}
.filter-row{display:flex;align-items:center;gap:18px;margin-top:12px;flex-wrap:wrap}
.typepills{display:flex;gap:6px;flex-wrap:wrap}
.typepills button{
  appearance:none;cursor:pointer;
  background:transparent;
  border:1px solid var(--line-strong);border-radius:8px;
  padding:2px 10px;margin:2px 1px;
  font-family:var(--body);font-size:12px;color:var(--ink);
  transition:background .15s var(--ease),color .15s var(--ease);
}
.typepills button.on{background:var(--ink);color:var(--paper)}
.search{
  flex:1;min-width:180px;max-width:360px;margin-left:auto;
  border:none;border-bottom:1px solid var(--line-strong);
  background:transparent;outline:none;
  font-family:var(--body);font-size:13.5px;color:var(--ink);
  padding:5px 2px;
}
.search::placeholder{color:var(--ink);opacity:.45}
.count-note{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;white-space:nowrap}

/* ---------- grid ---------- */
main{max-width:1440px;margin:0 auto;padding:30px 32px 90px}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:34px 0 18px;gap:16px;flex-wrap:wrap;
}
.section-head h2{
  font-family:var(--body);font-weight:900;font-size:24px;letter-spacing:.03em;
}
.section-head h2 .code{font-family:var(--disp);font-size:20px;letter-spacing:.18em;color:var(--ink-3);margin-left:12px}
.section-head p{font-size:12.5px;color:var(--ink-3);max-width:560px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
  gap:26px 22px;
}
.card{
  cursor:pointer;
  opacity:0;transform:translateY(14px);
  transition:opacity .55s var(--ease),transform .55s var(--ease);
}
.card.shown{opacity:1;transform:translateY(0)}
.card.hide{display:none}
.card .frame{
  aspect-ratio:1/1;
  background:#f0eddf;
  border:1px solid var(--line);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  transition:border-color .2s var(--ease),transform .25s var(--ease);
}
.card:hover .frame{border-color:var(--line-strong);transform:translateY(-4px)}
.card .frame img{
  max-width:82%;max-height:82%;
  object-fit:contain;
  filter:drop-shadow(5px 4px 4px rgba(23,21,16,.28));
  border-radius:2px;
}
.card .frame .placeholder{
  font-family:var(--disp);
  font-size:64px;letter-spacing:.04em;
  color:var(--ink);
  opacity:.16;
  user-select:none;
}
.card .frame .ph-mono{
  position:absolute;bottom:10px;right:12px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);
}
.card .frame .overlay{
  position:absolute;inset:0;
  background:rgba(23,21,16,.9);
  color:var(--paper);
  padding:16px;
  font-size:12px;line-height:1.7;
  opacity:0;
  transition:opacity .22s var(--ease);
  display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;
}
.card:hover .overlay{opacity:1}
.frame .multi{
  position:absolute;top:10px;left:10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  background:var(--ink);color:var(--yp);
  padding:2px 8px;border-radius:8px;
}
.caption{padding:10px 2px 0}
.caption .row1{display:flex;align-items:baseline;gap:10px}
.caption .eid{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);white-space:nowrap}
.caption .year{margin-left:auto;font-family:var(--disp);font-size:15px;letter-spacing:.08em;color:var(--ink);white-space:nowrap}
.caption h3{
  font-size:14.5px;font-weight:700;line-height:1.45;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.caption .meta{
  margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.chip{
  font-size:10.5px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:8px;
  padding:0 7px;line-height:18px;
  background:var(--paper);
}
.status-dot{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-3)}
.status-dot i{width:7px;height:7px;border-radius:50%;display:inline-block}
.st-ok i{background:#3d8a4f}.st-part i{background:#c9a400}.st-todo i{background:#b0563a}

/* ---------- modal ---------- */
.modal-mask{
  position:fixed;inset:0;z-index:100;
  background:rgba(23,21,16,.72);
  display:flex;align-items:center;justify-content:center;
  padding:4vh 4vw;
  opacity:0;pointer-events:none;
  transition:opacity .28s var(--ease);
}
.modal-mask.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--paper);
  width:min(1060px,100%);
  max-height:92vh;
  border:1px solid var(--line-strong);
  border-radius:10px;
  display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
  overflow:hidden;
  transform:translateY(16px);
  transition:transform .32s var(--ease);
}
.modal-mask.open .modal{transform:translateY(0)}
.modal-gallery{
  background:var(--ink);
  position:relative;
  display:flex;align-items:center;justify-content:center;
  min-height:340px;
}
.modal-gallery img{
  max-width:88%;max-height:78vh;object-fit:contain;
  filter:drop-shadow(6px 6px 8px rgba(0,0,0,.45));
  border-radius:3px;
}
.modal-gallery .noimg{
  color:var(--paper);text-align:center;padding:40px;
}
.modal-gallery .noimg .big{font-family:var(--disp);font-size:90px;color:var(--yp);letter-spacing:.06em}
.modal-gallery .noimg .t{font-size:12px;letter-spacing:.2em;opacity:.6;margin-top:8px}
.gal-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(250,247,234,.4);
  background:rgba(23,21,16,.5);color:var(--paper);
  font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.gal-btn:hover{background:var(--yp);color:var(--ink);border-color:var(--yp)}
.gal-prev{left:14px}.gal-next{right:14px}
.gal-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.gal-dots i{width:7px;height:7px;border-radius:50%;background:rgba(250,247,234,.35);cursor:pointer;transition:background .15s}
.gal-dots i.on{background:var(--yp)}
.gal-count{position:absolute;top:14px;left:16px;font-family:var(--mono);font-size:11px;color:var(--yp);letter-spacing:.14em}
.modal-body{padding:30px 32px 64px;overflow-y:auto}
.modal-body .eid{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-3)}
.modal-body h2{font-size:22px;font-weight:900;line-height:1.4;margin:8px 0 4px}
.modal-body .typeline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 18px}
.modal-body .typeline .chip{font-size:11px}
.field{margin-bottom:16px}
.field .fk{
  font-size:10.5px;letter-spacing:.26em;color:var(--ink-3);
  border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:7px;
}
.field .fv{font-size:13.5px;line-height:1.75}
.field .fv a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--yp-deep);word-break:break-all}
.field .fv a:hover{background:var(--yp)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.modal-close{
  position:absolute;top:14px;right:16px;z-index:5;
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line-strong);
  background:var(--paper);color:var(--ink);
  font-size:15px;cursor:pointer;
}
.modal-close:hover{background:var(--ink);color:var(--yp)}
.modal-nav{
  position:absolute;bottom:14px;z-index:5;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  color:var(--paper);opacity:.75;
  background:rgba(23,21,16,.55);padding:3px 10px;border-radius:8px;
  cursor:pointer;border:none;
}
.modal-nav:hover{background:var(--ink)}
.mn-prev{left:16px}.mn-next{right:16px}

/* ---------- footer ---------- */
footer{
  border-top:1px solid var(--line-strong);
  padding:26px 32px 34px;
  text-align:center;
  font-size:11.5px;color:var(--ink-3);letter-spacing:.1em;
}
footer .fp{font-family:var(--disp);font-size:15px;letter-spacing:.24em;color:var(--ink);margin-bottom:6px}

.empty{
  padding:80px 0;text-align:center;color:var(--ink-3);
  font-family:var(--mono);font-size:12px;letter-spacing:.2em;
}

@media(max-width:900px){
  .modal{grid-template-columns:1fr;max-height:94vh}
  .modal-gallery img{max-height:44vh}
  .thumb-index{display:none}
  .header-inner,.filter-inner,main{padding-left:18px;padding-right:18px}
  .search{margin-left:0;max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logotype">
      <h1>黄页经典艺术档案</h1>
      <span class="en">YELLOW&nbsp;PAGES&nbsp;ARCHIVE</span>
    </div>
    <p class="header-sub">从 1878 年纽黑文第一张 50 户纸板电话名单，到行走手指、Bell Gothic 字体与 J.R. Hartley 的眼泪——<b>200 条档案</b>，四个采集角度，把一本「过时的书」当作艺术史现场重新翻开。点击任意卡片展开完整档案。</p>
  </div>
  <nav class="thumb-index" id="thumbIndex" aria-label="档案分类快翻">
    <span data-col="经典艺术档案">ART</span>
    <span data-col="文学意象">LIT</span>
    <span data-col="社会素材">SOC</span>
    <span data-col="形式灵感">FRM</span>
  </nav>
</header>

<div class="stats" aria-hidden="true"><div class="stats-track" id="statsTrack"></div></div>

<div class="filterbar">
  <div class="filter-inner">
    <div class="collections" id="colTabs"></div>
    <div class="filter-row">
      <div class="typepills" id="typePills"></div>
      <span class="count-note" id="countNote"></span>
      <input class="search" id="searchBox" type="search" placeholder="搜索名称 / 摘要 / 标签…">
    </div>
  </div>
</div>

<main id="main"></main>

<footer>
  <div class="fp">LET YOUR FINGERS DO THE WALKING</div>
  黄页经典艺术档案 · 采集结构与标签体系 · 200 条 / 4 个角度
</footer>

<div class="modal-mask" id="modalMask" role="dialog" aria-modal="true">
  <div class="modal" id="modalBox"></div>
</div>

<script>
const SHEET_ORDER = ['经典艺术档案','文学意象','社会素材','形式灵感'];
const SHEET_EN = {'经典艺术档案':'CLASSIC ART · ART','文学意象':'LITERARY · LIT','社会素材':'SOCIETY · SOC','形式灵感':'FORM · FRM'};
const TYPE_GROUPS = {'图':['图','图文','图集','影像截图'],'文':['文','文（行业传说）'],'影像':['影像','影像/文','文/影像','影像截图'],'声音':['声音','声音/文','文/声音'],'实物':['实物','实物/图','实物/文']};
let DATA = null, ALL = [];

const state = { col:'全部', type:'全部', q:'' };

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusClass(s){ if(s==='已核实')return 'st-ok'; if(s==='部分核实')return 'st-part'; return 'st-todo'; }
function parseTags(t){ return (t.match(/＃([^\s＃]+)/g)||[]).map(x=>x.slice(1)); }

/* ---------- boot ---------- */
fetch('data.json').then(r=>r.json()).then(d=>{
  DATA = d;
  SHEET_ORDER.forEach(col=>{
    d[col].entries.forEach(e=>{ e.collection=col; e.tagList=parseTags(e.tags); ALL.push(e); });
  });
  buildStats(); buildTabs(); buildPills(); render();
  bindEvents();
  // deep link: #ART-08 直接打开对应卡片
  const h = decodeURIComponent(location.hash.slice(1));
  if(h && ALL.some(e=>e.id===h)) openModal(h);
});

/* ---------- stats ticker ---------- */
function buildStats(){
  const imgCount = ALL.reduce((n,e)=>n+e.images.length,0);
  const items = [
    ['200','档案条目 RECORDS'],[String(imgCount),'图像资产 IMAGES'],['4','采集角度 ANGLES'],
    ['1878','最早条目 EARLIEST'],['2026','最新条目 LATEST'],['59','含图条目 WITH IMAGE'],
  ];
  const half = items.map(([n,l])=>`<span class="stat-item"><span class="n">${n}</span><span class="l">${l}</span></span>`).join('');
  $('#statsTrack').innerHTML = half + half;
}

/* ---------- filters ---------- */
function buildTabs(){
  const counts = {'全部':ALL.length};
  SHEET_ORDER.forEach(c=>counts[c]=DATA[c].entries.length);
  $('#colTabs').innerHTML = ['全部',...SHEET_ORDER].map(c=>
    `<button data-col="${c}" class="${c===state.col?'on':''}">${c}<small>${counts[c]}</small></button>`).join('');
}
function buildPills(){
  const names = ['全部','图','文','影像','声音','实物'];
  $('#typePills').innerHTML = names.map(t=>`<button data-type="${t}" class="${t===state.type?'on':''}">${t}</button>`).join('');
}
function match(e){
  if(state.col!=='全部' && e.collection!==state.col) return false;
  if(state.type!=='全部' && !TYPE_GROUPS[state.type].includes(e.type)) return false;
  if(state.q){
    const hay = (e.name+' '+e.summary+' '+e.tags+' '+e.source+' '+e.id).toLowerCase();
    if(!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

/* ---------- render ---------- */
function render(){
  const main = $('#main');
  let html = '', total = 0;
  SHEET_ORDER.forEach(col=>{
    if(state.col!=='全部' && state.col!==col) return;
    const list = DATA[col].entries.filter(match);
    total += list.length;
    if(!list.length) return;
    html += `<section class="archive-section" id="sec-${col}">
      <div class="section-head">
        <h2>${col}<span class="code">${SHEET_EN[col]}</span></h2>
        <p>${esc(DATA[col].subtitle)}</p>
      </div>
      <div class="grid">${list.map(cardHTML).join('')}</div>
    </section>`;
  });
  main.innerHTML = html || `<div class="empty">NO RECORDS FOUND · 没有符合条件的档案</div>`;
  $('#countNote').textContent = `${total} / 200 条`;
  // reveal on scroll
  const io = new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){ en.target.classList.add('shown'); io.unobserve(en.target); }
  }),{threshold:.08});
  main.querySelectorAll('.card').forEach((c,i)=>{
    setTimeout(()=>io.observe(c), Math.min(i%12,8)*30);
  });
  main.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openModal(c.dataset.eid)));
  updateThumb();
}
function cardHTML(e){
  const img = e.images.length
    ? `<img src="images/${e.images[0]}" alt="${esc(e.name)}" loading="lazy">`
    : `<span class="placeholder">${e.id.split('-')[0]}</span><span class="ph-mono">${esc(e.type)} · NO IMAGE</span>`;
  const multi = e.images.length>1 ? `<span class="multi">×${e.images.length}</span>` : '';
  const chips = [`<span class="chip">${esc(e.type)}</span>`]
    .concat(e.tagList.slice(0,2).map(t=>`<span class="chip">${esc(t)}</span>`)).join('');
  return `<article class="card" data-eid="${e.id}">
    <div class="frame">${img}${multi}
      <div class="overlay">${esc(e.summary)}</div>
    </div>
    <div class="caption">
      <div class="row1"><span class="eid">${e.id}</span><span class="year">${esc(e.year)}</span></div>
      <h3>${esc(e.name)}</h3>
      <div class="meta">${chips}<span class="status-dot ${statusClass(e.status)}"><i></i>${esc(e.status)}</span></div>
    </div>
  </article>`;
}

/* ---------- modal ---------- */
let modalEntry = null, galIdx = 0;
function openModal(eid){
  modalEntry = ALL.find(e=>e.id===eid); galIdx = 0;
  drawModal();
  $('#modalMask').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  $('#modalMask').classList.remove('open');
  document.body.style.overflow='';
}
function galHTML(){
  const imgs = modalEntry.images;
  if(!imgs.length)
    return `<div class="noimg"><div class="big">${modalEntry.id.split('-')[0]}</div><div class="t">TEXT RECORD · 纯文本档案</div></div>`;
  const nav = imgs.length>1 ? `
    <button class="gal-btn gal-prev" data-g="-1" aria-label="上一张">‹</button>
    <button class="gal-btn gal-next" data-g="1" aria-label="下一张">›</button>
    <div class="gal-dots">${imgs.map((_,i)=>`<i class="${i===galIdx?'on':''}" data-i="${i}"></i>`).join('')}</div>
    <span class="gal-count">${galIdx+1} / ${imgs.length}</span>` : '';
  return `<img src="images/${imgs[galIdx]}" alt="${esc(modalEntry.name)}">${nav}`;
}
function drawModal(){
  const e = modalEntry;
  const idx = ALL.indexOf(e);
  const link = e.link && e.link.startsWith('http')
    ? `<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.link)}</a>` : esc(e.link||'—');
  $('#modalBox').innerHTML = `
    <div class="modal-gallery" id="galBox">${galHTML()}</div>
    <div class="modal-body">
      <button class="modal-close" id="mClose" aria-label="关闭">✕</button>
      <span class="eid">${e.id} · ${e.collection}</span>
      <h2>${esc(e.name)}</h2>
      <div class="typeline">
        <span class="chip">${esc(e.type)}</span>
        <span class="chip">年代 · ${esc(e.year)}</span>
        <span class="status-dot ${statusClass(e.status)}"><i></i>${esc(e.status)}</span>
      </div>
      <div class="field"><div class="fk">内容摘要</div><div class="fv">${esc(e.summary)}</div></div>
      ${e.note?`<div class="field"><div class="fk">备注说明</div><div class="fv">${esc(e.note)}</div></div>`:''}
      <div class="field"><div class="fk">标签</div><div class="tagrow">${e.tagList.map(t=>`<span class="chip">${esc(t)}</span>`).join('')||'—'}</div></div>
      <div class="field"><div class="fk">出处</div><div class="fv">${esc(e.source||'—')}</div></div>
      <div class="field"><div class="fk">来源链接</div><div class="fv">${link}</div></div>
      <div class="field"><div class="fk">采集渠道</div><div class="fv">${esc(e.channel||'—')}</div></div>
      <button class="modal-nav mn-prev" data-mn="-1">← ${ALL[(idx-1+ALL.length)%ALL.length].id}</button>
      <button class="modal-nav mn-next" data-mn="1">${ALL[(idx+1)%ALL.length].id} →</button>
    </div>`;
  $('#mClose').addEventListener('click',closeModal);
  $('#modalBox').querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    galIdx = (galIdx + parseInt(b.dataset.g) + modalEntry.images.length) % modalEntry.images.length;
    $('#galBox').innerHTML = galHTML(); bindGal();
  }));
  $('#modalBox').querySelectorAll('[data-mn]').forEach(b=>b.addEventListener('click',()=>{
    const ni = (idx + parseInt(b.dataset.mn) + ALL.length) % ALL.length;
    modalEntry = ALL[ni]; galIdx = 0; drawModal();
  }));
  bindGal();
}
function bindGal(){
  $('#galBox').querySelectorAll('.gal-dots i').forEach(d=>d.addEventListener('click',()=>{
    galIdx = parseInt(d.dataset.i);
    $('#galBox').innerHTML = galHTML(); bindGal();
  }));
  $('#galBox').querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    galIdx = (galIdx + parseInt(b.dataset.g) + modalEntry.images.length) % modalEntry.images.length;
    $('#galBox').innerHTML = galHTML(); bindGal();
  }));
}

/* ---------- events ---------- */
function bindEvents(){
  $('#colTabs').addEventListener('click',ev=>{
    const b = ev.target.closest('button'); if(!b) return;
    state.col = b.dataset.col;
    $('#colTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    render();
  });
  $('#typePills').addEventListener('click',ev=>{
    const b = ev.target.closest('button'); if(!b) return;
    state.type = b.dataset.type;
    $('#typePills').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    render();
  });
  let deb;
  $('#searchBox').addEventListener('input',ev=>{
    clearTimeout(deb);
    deb = setTimeout(()=>{ state.q = ev.target.value.trim(); render(); },180);
  });
  $('#modalMask').addEventListener('click',ev=>{ if(ev.target.id==='modalMask') closeModal(); });
  document.addEventListener('keydown',ev=>{
    if(!$('#modalMask').classList.contains('open')) return;
    if(ev.key==='Escape') closeModal();
    if(ev.key==='ArrowRight') stepEntry(1);
    if(ev.key==='ArrowLeft') stepEntry(-1);
  });
  $('#thumbIndex').addEventListener('click',ev=>{
    const s = ev.target.closest('span'); if(!s) return;
    state.col = s.dataset.col;
    $('#colTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.col===state.col));
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  });
}
function stepEntry(d){
  const i = ALL.indexOf(modalEntry);
  modalEntry = ALL[(i+d+ALL.length)%ALL.length]; galIdx = 0; drawModal();
}
function updateThumb(){
  $('#thumbIndex').querySelectorAll('span').forEach(s=>s.classList.toggle('on',s.dataset.col===state.col));
}
</script>
</body>
</html>
